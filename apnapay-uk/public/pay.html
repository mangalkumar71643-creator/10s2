<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5b4cf0">
  <title>Demo Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { min-height: 100dvh; background:
      radial-gradient(1200px 500px at 50% -180px, color-mix(in srgb, var(--brand) 22%, transparent), transparent 70%),
      var(--bg); }
    .wrap { max-width: 460px; margin: 0 auto; padding: 20px 16px 40px; }
    .brand { display: flex; align-items: center; gap: 12px; margin: 4px 4px 18px; }
    .avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 8px 18px -8px var(--brand); }
    .secure { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ok); font-weight: 600; }
    .secure svg { width: 13px; height: 13px; }
    .pay-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
    .amount-box { padding: 22px 22px 18px; text-align: center; border-bottom: 1px dashed var(--border); position: relative; }
    .amount-label { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .big-amount { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
    .why { font-size: 12.5px; color: var(--muted); max-width: 320px; margin: 4px auto 0; }
    .details { padding: 18px 18px 6px; display: grid; gap: 8px; }
    .drow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); }
    .drow .k { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .drow .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; overflow-wrap: anywhere; }
    .drow.ref { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 35%, var(--border)); }
    .drow.ref .v { color: var(--brand); font-size: 22px; letter-spacing: .08em; }
    .drow .grow { min-width: 0; }
    .must { font-size: 12.5px; color: var(--warn); font-weight: 600; margin: 2px 4px 0; }
    .sim { margin: 14px 18px 18px; padding: 14px; border-radius: 16px; border: 2px dashed color-mix(in srgb, var(--warn) 55%, var(--border)); background: color-mix(in srgb, var(--warn) 7%, var(--surface)); display: grid; gap: 10px; }
    .sim > * { min-width: 0; }
    .sim .btn { white-space: normal; height: auto; min-height: 44px; padding-top: 10px; padding-bottom: 10px; text-align: center; }
    .sim .t { font-size: 12px; font-weight: 700; color: var(--warn); text-transform: uppercase; letter-spacing: .06em; }
    .status-bar { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--surface-2); border-top: 1px solid var(--border); }
    .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); position: relative; flex: none; }
    .pulse::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--warn); animation: ring 1.6s ease-out infinite; }
    @keyframes ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
    .timer { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); }
    .timer.low { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
    .steps { margin: 16px 4px 0; display: grid; gap: 10px; }
    .step { display: flex; gap: 12px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
    .step b { color: var(--text); font-weight: 600; }
    .step .n { width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
    .result { padding: 36px 24px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .check { width: 88px; height: 88px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; box-shadow: 0 16px 40px -12px var(--ok); animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
    .check svg { width: 46px; height: 46px; color: #fff; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .45s .25s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .clock { width: 80px; height: 80px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
    .clock svg { width: 40px; height: 40px; }
    .receipt { width: 100%; margin-top: 10px; border-radius: 14px; background: var(--surface-2); padding: 6px 14px; text-align: left; }
    .receipt div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14px; border-bottom: 1px dashed var(--border); }
    .receipt div:last-child { border-bottom: 0; }
    .receipt span:first-child { color: var(--muted); }
    .foot { text-align: center; margin-top: 22px; font-size: 12px; color: var(--faint); display: flex; justify-content: center; align-items: center; gap: 6px; }
    .foot svg { width: 13px; height: 13px; }
    @media (min-width: 700px) { .wrap { padding-top: 48px; } }
  </style>
</head>
<body>
  <div class="demo-ribbon">DEMO · no real money · do not send a real payment</div>
  <main class="wrap" id="app">
    <div class="pay-card" style="padding:28px"><div class="skeleton" style="height:28px;width:60%;margin:0 auto 14px"></div><div class="skeleton" style="height:200px;margin:0 auto"></div></div>
  </main>
  <div class="toasts" id="toasts"></div>
  <script src="/js/pay.js"></script>
</body>
</html>
